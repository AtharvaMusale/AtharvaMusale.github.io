{% extends "base.html" %}
{% block content %}
<article class="wrap narrow post">
  <a class="back" href="/blog/">← All writing</a>
  <p class="eyebrow"><time datetime="{{ page.date.isoformat() }}">{{ page.date | date }}</time> · {{ page.reading_time }} min read</p>
  <h1>{{ page.title }}</h1>
  <div class="prose">{{ page.html | safe }}</div>
</article>
{% endblock %}
