{% extends "base.html" %}
{% block content %}
<section class="band case-hero">
  <div class="hero-grid" aria-hidden="true"></div>
  <div class="narrow">
    <a class="back" href="/blog/">← All writing</a>
    <p class="label"><span><time datetime="{{ page.date.isoformat() }}">{{ page.date | date }}</time></span>{{ page.reading_time }} min read</p>
    <h1>{{ page.title }}</h1>
  </div>
</section>
<article class="band">
  <div class="narrow prose">{{ page.html | safe }}</div>
</article>
{% endblock %}
